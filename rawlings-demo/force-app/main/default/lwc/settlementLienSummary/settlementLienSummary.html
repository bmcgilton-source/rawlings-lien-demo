<template>
    <lightning-card title="Lien Summary" icon-name="standard:summary">
        <lightning-button
            slot="actions"
            label="Refresh"
            icon-name="utility:refresh"
            onclick={handleRefresh}
        ></lightning-button>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center" style="min-height: 4rem;">
                <lightning-spinner alternative-text="Loading lien summary..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={isError}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span>{errorMessage}</span>
                </div>
            </div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-p-around_large slds-align_absolute-center slds-text-color_weak">
                No liens yet for this settlement.
            </div>
        </template>

        <template if:true={isReady}>
            <div class="slds-p-around_medium lsg-summary">

                <div class="lsg-group">
                    <p class="lsg-group-label">Overview</p>
                    <div class="slds-grid slds-gutters_x-small">
                        <div class="slds-col slds-size_1-of-2">
                            <div class="lsg-stat">
                                <p class="lsg-stat-number">{totalLiens}</p>
                                <p class="lsg-stat-label">Total Liens</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <div class="lsg-stat lsg-stat_escalated">
                                <p class="lsg-stat-number">{escalatedCount}</p>
                                <p class="lsg-stat-label">Escalated</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lsg-group">
                    <p class="lsg-group-label">Pipeline Stage</p>
                    <template if:true={hasActiveStages}>
                        <div class="lsg-stage-row">
                            <template for:each={activeStageTiles} for:item="tile">
                                <span key={tile.stage} class="lsg-stage-pill">
                                    <span class="lsg-stage-pill-count">{tile.count}</span> {tile.stage}
                                </span>
                            </template>
                            <template if:true={hiddenStageNote}>
                                <span class="lsg-muted-note">{hiddenStageNote}</span>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasActiveStages}>
                        <p class="lsg-muted-note">No liens currently sitting in a pipeline stage.</p>
                    </template>
                </div>

                <div class="lsg-group lsg-group_last">
                    <p class="lsg-group-label">Deadline Status</p>
                    <template if:true={hasDeadlineData}>
                        <div class="lsg-deadline-bar">
                            <template for:each={deadlineSegments} for:item="seg">
                                <div key={seg.key} class={seg.cssClass} style={seg.style}>{seg.count}</div>
                            </template>
                        </div>
                        <div class="lsg-deadline-legend">
                            <span><i class="lsg-dot lsg-dot_green"></i>Green - 20+ days</span>
                            <span><i class="lsg-dot lsg-dot_yellow"></i>Yellow - 11-20 days</span>
                            <span><i class="lsg-dot lsg-dot_red"></i>Red - 10 or fewer days</span>
                        </div>
                    </template>
                    <template if:false={hasDeadlineData}>
                        <p class="lsg-muted-note">No liens with a tracked response deadline.</p>
                    </template>
                </div>

            </div>
        </template>
    </lightning-card>
</template>
