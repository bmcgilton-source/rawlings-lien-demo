<template>
    <lightning-card title="Lien Summary" icon-name="standard:summary">
        <lightning-button
            slot="actions"
            label="Refresh"
            icon-name="utility:refresh"
            onclick={handleRefresh}
        ></lightning-button>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center" style="min-height: 4rem;">
                <lightning-spinner alternative-text="Loading lien summary..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={isError}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span>{errorMessage}</span>
                </div>
            </div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-p-around_large slds-align_absolute-center slds-text-color_weak">
                No liens yet for this settlement.
            </div>
        </template>

        <template if:true={isReady}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-around_xx-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <p class="slds-text-heading_medium">{totalLiens}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Total Liens</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-around_xx-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <lightning-icon icon-name="utility:warning" variant="warning" size="x-small"></lightning-icon>
                            <p class="slds-text-heading_medium">{escalatedCount}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Escalated</p>
                        </div>
                    </div>
                    <template for:each={stageTiles} for:item="tile">
                        <div key={tile.stage} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6 slds-p-around_xx-small">
                            <div class="slds-box slds-box_x-small slds-text-align_center">
                                <p class="slds-text-heading_medium">{tile.count}</p>
                                <p class="slds-text-body_small slds-text-color_weak">{tile.stage}</p>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_x-small">
                    <div class="slds-col slds-size_1-of-3 slds-p-around_xx-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <lightning-icon icon-name="utility:success" variant="success" size="x-small"></lightning-icon>
                            <p class="slds-text-heading_medium">{greenCount}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Green</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-p-around_xx-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <lightning-icon icon-name="utility:warning" variant="warning" size="x-small"></lightning-icon>
                            <p class="slds-text-heading_medium">{yellowCount}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Yellow</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-p-around_xx-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                            <p class="slds-text-heading_large">{redCount}</p>
                            <p class="slds-text-body_small slds-text-color_weak">Red</p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
